
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Create your account to get started."
    />

    <title>Create Account</title>

    <link rel="stylesheet" href="./register.css" />
    <script src="./register.js" defer></script>
  </head>

  <body>
    <main class="register-page">
      <section class="register-card" aria-labelledby="register-title">
        <header class="register-header">
          <h1 id="register-title">Create Account</h1>
          <p>Join us today</p>
        </header>

        <form class="register-form" id="registerForm" action="" method="post">
          <div class="name-fields">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input id="firstName" name="firstName" type="text" placeholder="John" autocomplete="given-name"  required
              />
            </div>

            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input id="lastName"name="lastName"type="text"placeholder="Doe"autocomplete="family-name"required/>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrapper">
              <input  id="password"  name="password"  type="password"placeholder="Enter your password"autocomplete="new-password"minlength="8"pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"aria-describedby="password-rules"/>

              <button class="password-toggle"type="button"aria-label="Show password"aria-press >
                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg"  width="17" height="17" viewBox="0 0 24 24" fill="none"  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"  stroke-linejoin="round"  aria-hidden="true"
                >
                  <path
                    d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>

            <ul class="password-rules" id="password-rules">
              <li>At least 8 characters</li>
              <li>Uppercase and lowercase letters</li>
              <li>At least one number</li>
            </ul>
          </div>

          <button class="submit-button" type="submit">
            Create Account
          </button>

          <p class="login-prompt">
            Already have an account?
            <a href="./login.html">Sign in</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
